<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmar aula | Behrend BJJ</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="app-section">
        <a href="/">Voltar ao início</a>
        <h1 class="heading">Confirmar <span>aula</span></h1>

        <form id="login-aluno" class="app-card app-form">
            <h2>Entrar como aluno</h2>
            <label for="aluno-email">E-mail</label>
            <input id="aluno-email" type="email" name="email" autocomplete="username" required>
            <label for="aluno-senha">Senha</label>
            <input id="aluno-senha" type="password" name="senha" autocomplete="current-password" required>
            <button class="btn-smais" type="submit">Entrar</button>
        </form>

        <section id="area-minhas-aulas" hidden>
            <button id="sair-aulas" class="btn-mini" type="button">Sair</button>
            <h2>Próximas aulas</h2>
            <div id="lista-minhas-aulas"></div>
        </section>
        <p id="feedback-aulas" role="status"></p>
    </main>
    <script src="/js/script.js"></script>
    <script src="/js/presencas.js"></script>
</body>
</html>
